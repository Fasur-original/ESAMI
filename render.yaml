# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: esami-website
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      # Public address used for canonical URLs, the sitemap and social previews.
      # Change it when a custom domain is connected, then redeploy.
      - key: SITE_URL
        value: https://esami-website.onrender.com
